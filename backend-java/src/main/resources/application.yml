spring:
  application.name: returnos-backend
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/returnos}
    username: ${DATABASE_USERNAME:returnos}
    password: ${DATABASE_PASSWORD:returnos}
    hikari:
      connection-init-sql: SET TIME ZONE 'UTC'
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB
server:
  port: ${PORT:8080}
returnos:
  jwt-secret: ${JWT_SECRET:}
  jwt-expiration-days: ${JWT_EXPIRATION_DAYS:7}
  # Exact frontend origin(s), comma separated. RETURNOS_CORS_ORIGINS is the
  # canonical name for this property; CORS_ORIGINS is kept as a fallback so
  # existing deployments keep working.
  cors-origins: ${RETURNOS_CORS_ORIGINS:${CORS_ORIGINS:http://localhost:5173}}
  demo-mode: ${DEMO_MODE:false}
  # Document storage: 'local' (default, ./uploads) or 's3'. S3 credentials
  # are never configured here — the SDK default chain reads AWS_ACCESS_KEY_ID
  # / AWS_SECRET_ACCESS_KEY from the environment.
  storage-provider: ${STORAGE_PROVIDER:local}
  aws-region: ${AWS_REGION:ap-south-1}
  aws-s3-bucket: ${AWS_S3_BUCKET:returnos}
