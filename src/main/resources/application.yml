spring:
  application:
    name: ReturnOS
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/returnos}
    username: ${DATABASE_USER:returnos}
    password: ${DATABASE_PASSWORD:returnos}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        default_schema: public
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true

server:
  port: ${PORT:8080}
  error:
    include-message: never
    include-binding-errors: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

returnos:
  policy:
    return-window-days: ${RETURN_WINDOW_DAYS:30}
    blocked-categories: ${BLOCKED_CATEGORIES:}
    changed-mind-window-days: ${CHANGED_MIND_WINDOW_DAYS:14}
  jwt:
    secret: ${JWT_SECRET:change-me-to-a-very-long-random-secret-for-dev-only-min-32-chars}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  risk:
    recent-window-days: ${RISK_RECENT_WINDOW_DAYS:30}
    points-per-recent-return: ${RISK_POINTS_PER_RECENT_RETURN:8}
    max-recent-points: ${RISK_MAX_RECENT_POINTS:32}
    lifetime-tier1-count: 3
    lifetime-tier1-points: 5
    lifetime-tier2-count: 6
    lifetime-tier2-points: 10
    high-value-threshold: ${RISK_HIGH_VALUE_THRESHOLD:5000}
    high-value-points: 10
    repeat-product-points: 12
    multi-item-threshold: 2
    multi-item-points: 6
    medium-threshold: ${RISK_MEDIUM_THRESHOLD:30}
    high-threshold: ${RISK_HIGH_THRESHOLD:60}
  disposition:
    restock-rate: 0.95
    resell-rate: 0.70
    refurbish-rate: 0.80
    liquidate-rate: 0.35
    recycle-rate: 0.10
    vendor-rate: 1.00
    processing-cost: ${DISPOSITION_PROCESSING_COST:150}
    shipping-cost: ${DISPOSITION_SHIPPING_COST:250}
    refurbishment-cost: ${DISPOSITION_REFURBISHMENT_COST:600}
    vendor-window-days: ${DISPOSITION_VENDOR_WINDOW_DAYS:30}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.returnos: INFO
    org.hibernate.SQL: WARN
