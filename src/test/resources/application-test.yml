spring:
  datasource:
    url: jdbc:h2:mem:returnos_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        globally_quoted_identifiers: false
  flyway:
    enabled: false

returnos:
  policy:
    return-window-days: 30
    blocked-categories: ""
    changed-mind-window-days: 14
  jwt:
    secret: test-secret-key-must-be-at-least-32-chars-long-for-hs256-tests
    expiration-ms: 3600000
  seed:
    enabled: false

logging:
  level:
    com.returnos: INFO
