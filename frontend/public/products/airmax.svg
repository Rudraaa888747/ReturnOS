<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Air Max Runner sneaker, side profile in white and crimson">
  <defs>
    <radialGradient id="am-bg" cx="50%" cy="36%" r="74%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#f4f4f1"/>
      <stop offset="100%" stop-color="#e5e5e0"/>
    </radialGradient>
    <linearGradient id="am-upper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="52%" stop-color="#f4f4f1"/>
      <stop offset="100%" stop-color="#dbdbd5"/>
    </linearGradient>
    <linearGradient id="am-swoosh" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#dc2a50"/>
      <stop offset="100%" stop-color="#94102b"/>
    </linearGradient>
    <linearGradient id="am-midsole" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="65%" stop-color="#efefec"/>
      <stop offset="100%" stop-color="#cdcdc7"/>
    </linearGradient>
    <linearGradient id="am-air" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#eef6ff"/>
      <stop offset="100%" stop-color="#bcd6ef"/>
    </linearGradient>
    <linearGradient id="am-out" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#40444c"/>
      <stop offset="100%" stop-color="#1c1f25"/>
    </linearGradient>
    <radialGradient id="am-shadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1b1d22" stop-opacity="0.32"/>
      <stop offset="65%" stop-color="#1b1d22" stop-opacity="0.09"/>
      <stop offset="100%" stop-color="#1b1d22" stop-opacity="0"/>
    </radialGradient>

    <path id="am-body" d="M74 206
      C74 182 88 164 116 156
      L184 138
      C198 134 206 126 212 114
      L242 110
      C246 122 249 131 252 140
      C264 130 279 121 296 115
      L312 115
      C328 121 337 137 337 163
      L337 206 Z"/>
    <clipPath id="am-clip"><use href="#am-body"/></clipPath>
  </defs>

  <rect width="400" height="300" rx="20" fill="url(#am-bg)"/>
  <ellipse cx="206" cy="250" rx="140" ry="16" fill="url(#am-shadow)"/>

  <!-- upper -->
  <use href="#am-body" fill="url(#am-upper)"/>
  <g clip-path="url(#am-clip)">
    <!-- toe cap seam -->
    <path d="M74 206 C76 180 90 164 118 156 L134 152 L140 210 Z" fill="#fbfbfa"/>
    <path d="M138 150 L142 210" stroke="#d5d5ce" stroke-width="2" fill="none"/>
    <g fill="#c8c8c1">
      <circle cx="100" cy="184" r="2"/><circle cx="112" cy="176" r="2"/><circle cx="124" cy="169" r="2"/>
      <circle cx="104" cy="196" r="2"/><circle cx="116" cy="188" r="2"/><circle cx="128" cy="181" r="2"/>
    </g>
    <!-- swoosh sweeping up to the heel -->
    <path d="M132 200 C176 196 232 178 300 140 C296 160 268 184 214 200 C186 208 154 210 132 200 Z"
          fill="url(#am-swoosh)"/>
    <!-- heel counter panel -->
    <path d="M294 116 C322 122 337 140 337 166 L337 210 L286 210 L286 136 Z" fill="#edebe6"/>
    <path d="M288 138 C300 146 306 160 306 178 L306 210" stroke="#d8d6d0" stroke-width="2" fill="none"/>
    <!-- tongue -->
    <path d="M212 114 L242 110 C246 124 249 133 252 142 L224 150 C220 136 216 124 212 114 Z" fill="#f8f8f6"/>
    <path d="M218 120 L244 116" stroke="#d9d9d2" stroke-width="2"/>
    <!-- laces across the throat -->
    <g stroke="#adaba5" stroke-width="3.4" stroke-linecap="round" fill="none">
      <path d="M176 150 L214 140"/>
      <path d="M182 162 L222 152"/>
      <path d="M190 174 L230 164"/>
    </g>
    <g fill="#8b8983">
      <circle cx="176" cy="150" r="2.6"/><circle cx="214" cy="140" r="2.6"/>
      <circle cx="182" cy="162" r="2.6"/><circle cx="222" cy="152" r="2.6"/>
      <circle cx="190" cy="174" r="2.6"/><circle cx="230" cy="164" r="2.6"/>
    </g>
    <!-- ankle collar opening -->
    <path d="M252 140 C264 130 279 121 296 115 L306 115 C290 128 274 140 260 150 Z" fill="#d7d5cf"/>
    <!-- top light -->
    <path d="M74 198 C78 174 92 160 118 152 L184 134 L184 146 L120 164 C96 172 82 186 80 204 Z"
          fill="#ffffff" opacity="0.55"/>
  </g>
  <use href="#am-body" fill="none" stroke="#c2c2bb" stroke-width="1.8"/>

  <!-- midsole -->
  <path d="M68 209 C67 197 78 191 96 190 L322 188 C340 188 350 195 349 207 L347 215
           C345 222 336 226 321 226 L93 228 C77 228 68 220 68 212 Z"
        fill="url(#am-midsole)" stroke="#c9c9c2" stroke-width="1.4"/>
  <g>
    <ellipse cx="300" cy="208" rx="26" ry="9" fill="url(#am-air)" stroke="#a3c0da" stroke-width="1.2"/>
    <path d="M284 208 h32 M292 201 v14 M308 201 v14" stroke="#a9c5de" stroke-width="1.1"/>
  </g>
  <path d="M88 197 v27 M104 195 v28 M120 194 v29 M136 193 v29 M152 192 v29"
        stroke="#d0d0c9" stroke-width="1.6" stroke-linecap="round"/>

  <!-- outsole -->
  <path d="M70 223 C69 215 79 212 95 211 L323 209 C341 209 351 216 350 226
           C349 236 339 241 323 241 L97 243 C80 243 69 235 70 227 Z"
        fill="url(#am-out)"/>
  <g stroke="#0e1013" stroke-width="2" opacity="0.4" stroke-linecap="round">
    <path d="M96 218 l7 15"/><path d="M118 217 l7 15"/><path d="M140 216 l7 15"/>
    <path d="M162 215 l7 15"/><path d="M184 214 l7 15"/><path d="M206 214 l7 15"/>
    <path d="M228 213 l7 15"/><path d="M250 212 l7 15"/><path d="M272 212 l7 15"/>
    <path d="M294 211 l7 15"/><path d="M316 211 l7 15"/>
  </g>
</svg>
